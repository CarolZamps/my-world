<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F0E13">
<title>Checklist — Meu Mundo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0E13;
    --surface: #18161F;
    --surface-2: #221F2C;
    --border: #2A2735;
    --text: #F5F3F7;
    --text-dim: #8B8595;
    --text-faint: #5A5566;
    --accent: #FBBF24;
    --accent-deep: #D97706;
    --success: #6EE7B7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    overscroll-behavior-y: contain;
    -webkit-font-smoothing: antialiased;
  }

  body {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: 80px;
  }

  .header {
    padding: 24px 20px 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }

  .header h1 .focus {
    color: var(--accent);
    font-style: italic;
  }

  /* TABS */
  .tabs-container {
    display: flex;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .tabs-container::-webkit-scrollbar { display: none; }

  .tab-btn {
    padding: 10px 16px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .tab-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .tab-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* CONTENT */
  .content {
    padding: 20px;
  }

  .tab-pane {
    display: none;
  }

  .tab-pane.active {
    display: block;
  }

  /* INPUT FORM */
  .input-form {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .input-form input {
    flex: 1;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .input-form input::placeholder {
    color: var(--text-faint);
  }

  .input-form input:focus {
    border-color: var(--accent);
  }

  .btn-add {
    padding: 12px 16px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .btn-add:hover {
    background: var(--accent-deep);
  }

  .btn-add:active {
    transform: scale(0.98);
  }

  /* CHECKLIST ITEMS */
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .checklist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.2s ease;
  }

  .checklist-item.completed {
    opacity: 0.6;
    background: var(--surface-2);
  }

  .checklist-item.completed .item-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .item-checkbox {
    width: 20px;
    height: 20px;
    min-width: 20px;
    cursor: pointer;
    accent-color: var(--success);
  }

  .item-text {
    flex: 1;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .btn-delete {
    padding: 8px 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .btn-delete:hover {
    background: rgba(239, 68, 68, 0.1);
    border-color: #EF4444;
    color: #EF4444;
  }

  .btn-delete:active {
    background: rgba(239, 68, 68, 0.2);
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
  }

  .empty-state svg {
    width: 48px;
    height: 48px;
    opacity: 0.4;
    margin-bottom: 16px;
  }

  .empty-state p {
    font-size: 14px;
  }

  /* BACK BUTTON */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .back-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .back-btn svg {
    width: 16px;
    height: 16px;
  }

  /* PROGRESS */
  .progress-info {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 8px;
  }

  /* SUGGESTED ITEMS */
  .suggested-section {
    margin-bottom: 20px;
    padding: 0 0 20px;
    border-bottom: 1px solid var(--border);
  }

  .suggested-section:last-child {
    border-bottom: none;
    margin-bottom: 24px;
  }

  .suggested-category-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding: 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .suggested-items-wrap {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .suggested-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--surface-2);
    transition: all 0.2s ease;
  }

  .suggested-item:last-child {
    border-bottom: none;
  }

  .suggested-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    min-width: 18px;
    cursor: pointer;
    accent-color: var(--success);
  }

  .suggested-item:hover {
    color: var(--text);
  }

  .suggested-item.checked {
    opacity: 0.5;
    color: var(--text-faint);
  }

  .suggested-item.checked span {
    text-decoration: line-through;
  }

</style>
</head>
<body>

<header class="header">
  <a href="/" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Voltar
  </a>
  <div class="eyebrow">Checklist</div>
  <h1>Tarefas <span class="focus">do dia</span></h1>
</header>

<div class="tabs-container">
  <button class="tab-btn active" data-tab="daily">📋 Dia a Dia</button>
  <button class="tab-btn" data-tab="travel">✈️ Viagem</button>
</div>

<div class="content">

  <!-- ABA: DIA A DIA -->
  <div class="tab-pane active" id="daily">
    <div class="input-form">
      <input type="text" id="daily-input" placeholder="Adicionar tarefa do dia..." maxlength="100" onkeypress="if(event.key==='Enter') addDaily()">
      <button class="btn-add" onclick="addDaily()">Adicionar</button>
    </div>
    <div id="daily-list" class="checklist"></div>
    <div class="progress-info" id="daily-progress"></div>
  </div>

  <!-- ABA: VIAGEM -->
  <div class="tab-pane" id="travel">
    <div class="input-form">
      <input type="text" id="travel-input" placeholder="Adicionar item da mala..." maxlength="100" onkeypress="if(event.key==='Enter') addTravel()">
      <button class="btn-add" onclick="addTravel()">Adicionar</button>
    </div>

    <!-- ITENS SUGERIDOS -->
    <div id="suggested-items" style="margin-bottom: 24px;"></div>

    <div id="travel-list" class="checklist"></div>
    <div class="progress-info" id="travel-progress"></div>
  </div>

</div>

<script>
const SB_URL = 'https://dfeubhkpuiwodpadysmi.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZXViaGtwdWl3b2RwYWR5c21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTk2NDM3MzksImV4cCI6MjAzNTIyMzczOX0.2lJ3LdKI8-fVL6lRjxChMxMaLPFMN5HtLqzb3jnbP9M';

let checklists = {
  daily: [],
  travel: []
};

// Obter data de hoje em formato ISO (YYYY-MM-DD)
function getTodayISO() {
  const today = new Date();
  return today.toISOString().split('T')[0];
}

// ITENS SUGERIDOS PARA MALA
const TRAVEL_SUGGESTIONS = [
  {
    name: "👕 Roupas",
    items: [
      "Casaco ou jaqueta mais quente",
      "Blusas de manga longa (2-3)",
      "Blusa(s) de manga curta",
      "Calças compridas",
      "Roupa mais leve para tarde",
      "Pijama quentinho",
      "Roupa íntima e meias (+ reserva)",
      "Sapato fechado confortável",
      "Sapato mais arrumado"
    ]
  },
  {
    name: "☔ Chuva",
    items: ["Guarda-chuva", "Corta-vento"]
  },
  {
    name: "🧴 Necessaire",
    items: [
      "Vitaminas",
      "Escova e pasta de dente",
      "Desodorante",
      "Protetor solar",
      "Itens de skincare"
    ]
  },
  {
    name: "💄 Maquiagem",
    items: [
      "Base / BB cream",
      "Corretivo",
      "Pó",
      "Blush",
      "Máscara de cílios",
      "Batom / gloss",
      "Delineador",
      "Pincéis / esponjas",
      "Demaquilante"
    ]
  },
  {
    name: "💇 Cabelo",
    items: ["Escova ou pente", "Secador", "Produtos de finalização"]
  },
  {
    name: "💻 Home office",
    items: [
      "Notebook e carregador",
      "Mouse",
      "Fones de ouvido",
      "Carregador portátil"
    ]
  },
  {
    name: "🏋️ Academia",
    items: [
      "Roupas de treino",
      "Tênis de treino",
      "Garrafinha de água",
      "Toalha pequena",
      "Fones sem fio"
    ]
  },
  {
    name: "✅ Extras",
    items: [
      "Carregador de celular",
      "Documento de identidade"
    ]
  }
];

// Inicializar
async function init() {
  await loadFromSupabase();
  renderDaily();
  renderTravel();
  setupTabs();
}

// TABS
function setupTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tabName = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabName).classList.add('active');
    });
  });
}

// ADD ITEMS
function addDaily() {
  const input = document.getElementById('daily-input');
  if (!input.value.trim()) return;

  const item = { id: Date.now(), tipo: 'daily', texto: input.value, concluido: false, data: getTodayISO() };
  checklists.daily.push(item);
  input.value = '';

  saveToSupabase(item);
  renderDaily();
}

function addTravel() {
  const input = document.getElementById('travel-input');
  if (!input.value.trim()) return;

  const item = { id: Date.now(), tipo: 'travel', texto: input.value, concluido: false };
  checklists.travel.push(item);
  input.value = '';

  saveToSupabase(item);
  renderTravel();
}

// RENDER
function renderDaily() {
  const container = document.getElementById('daily-list');
  renderList(checklists.daily, container, 'daily');
  updateProgress('daily-progress', checklists.daily);
}

function renderTravel() {
  renderSuggestedItems();
  const container = document.getElementById('travel-list');
  renderList(checklists.travel, container, 'travel');
  updateProgress('travel-progress', checklists.travel);
}

function renderSuggestedItems() {
  const container = document.getElementById('suggested-items');
  container.innerHTML = '';

  TRAVEL_SUGGESTIONS.forEach(category => {
    const section = document.createElement('div');
    section.className = 'suggested-section';

    const title = document.createElement('div');
    title.className = 'suggested-category-title';
    title.textContent = category.name;
    section.appendChild(title);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'suggested-items-wrap';

    category.items.forEach(itemText => {
      const existingItem = checklists.travel.find(i => i.texto.toLowerCase() === itemText.toLowerCase());
      const id = existingItem?.id || `suggested-${Date.now()}-${Math.random()}`;
      const isChecked = existingItem?.concluido ?? false;

      const li = document.createElement('div');
      li.className = `suggested-item ${isChecked ? 'checked' : ''}`;
      li.innerHTML = `<input type="checkbox" id="${id}" ${isChecked ? 'checked' : ''}><span>${escapeHtml(itemText)}</span>`;

      li.addEventListener('change', (e) => {
        if (e.target.type === 'checkbox') {
          toggleSuggestedItem(itemText, e.target.checked);
        }
      });

      li.addEventListener('click', (e) => {
        if (e.target.type !== 'checkbox') {
          const cb = li.querySelector('input[type="checkbox"]');
          cb.checked = !cb.checked;
          toggleSuggestedItem(itemText, cb.checked);
        }
      });

      itemsWrap.appendChild(li);
    });

    section.appendChild(itemsWrap);
    container.appendChild(section);
  });
}

function toggleSuggestedItem(texto, isChecked) {
  let item = checklists.travel.find(i => i.texto.toLowerCase() === texto.toLowerCase());

  if (!item) {
    // Se não existe, cria
    item = { id: Date.now(), tipo: 'travel', texto, concluido: isChecked };
    checklists.travel.push(item);
    saveToSupabase(item);
  } else {
    // Se existe, atualiza
    item.concluido = isChecked;
    updateSupabase(item);
  }

  renderTravel();
}

function renderList(items, container, tipo) {
  if (items.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2"/></svg>
        <p>Nenhuma tarefa adicionada</p>
      </div>
    `;
    return;
  }

  container.innerHTML = items.map(item => `
    <div class="checklist-item ${item.concluido ? 'completed' : ''}">
      <input type="checkbox" class="item-checkbox" ${item.concluido ? 'checked' : ''}
        onchange="toggleItem('${item.id}', ${item.concluido}, '${tipo}')">
      <span class="item-text">${escapeHtml(item.texto)}</span>
      <button class="btn-delete" onclick="deleteItem('${item.id}', '${tipo}')">Deletar</button>
    </div>
  `).join('');
}

function updateProgress(elementId, items) {
  if (items.length === 0) return;
  const done = items.filter(i => i.concluido).length;
  const percent = Math.round((done / items.length) * 100);
  document.getElementById(elementId).textContent = `${done}/${items.length} completos (${percent}%)`;
}

// TOGGLE & DELETE
function toggleItem(id, wasCompleted, tipo) {
  const arr = tipo === 'daily' ? checklists.daily : checklists.travel;
  const itemIdx = arr.findIndex(i => i.id == id);
  if (itemIdx > -1) {
    const item = arr[itemIdx];
    item.concluido = !wasCompleted;
    updateSupabase(item);

    // Reordenar: tarefas concluídas vão para o final
    arr.splice(itemIdx, 1);
    if (item.concluido) {
      arr.push(item); // Adiciona no final se completo
    } else {
      arr.unshift(item); // Adiciona no início se descompleto
    }

    tipo === 'daily' ? renderDaily() : renderTravel();
  }
}

function deleteItem(id, tipo) {
  const arr = tipo === 'daily' ? checklists.daily : checklists.travel;
  const idx = arr.findIndex(i => i.id == id);
  if (idx > -1) {
    const item = arr[idx];
    arr.splice(idx, 1);
    deleteFromSupabase(item);
    tipo === 'daily' ? renderDaily() : renderTravel();
  }
}

// SUPABASE
async function loadFromSupabase() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/checklists`, {
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
    });
    if (res.ok) {
      const data = await res.json();
      const todayISO = getTodayISO();
      // Daily items: apenas os de hoje
      checklists.daily = data
        .filter(i => i.tipo === 'daily' && i.data === todayISO)
        .map(i => ({ ...i, id: i.id || i.texto }));
      // Travel items: todos (não filtram por data)
      checklists.travel = data.filter(i => i.tipo === 'travel').map(i => ({ ...i, id: i.id || i.texto }));
    }
  } catch(e) { console.log('Supabase load falhou, usando fallback'); }
}

async function saveToSupabase(item) {
  try {
    const payload = { id: item.id, tipo: item.tipo, texto: item.texto, concluido: item.concluido };
    // Daily items: incluir data
    if (item.tipo === 'daily') {
      payload.data = item.data;
    }
    await fetch(`${SB_URL}/rest/v1/checklists`, {
      method: 'POST',
      headers: {
        'apikey': SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify(payload),
    });
  } catch(e) { /* silencioso */ }
}

async function updateSupabase(item) {
  try {
    await fetch(`${SB_URL}/rest/v1/checklists?id=eq.${item.id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ concluido: item.concluido }),
    });
  } catch(e) { /* silencioso */ }
}

async function deleteFromSupabase(item) {
  try {
    await fetch(`${SB_URL}/rest/v1/checklists?id=eq.${item.id}`, {
      method: 'DELETE',
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` },
    });
  } catch(e) { /* silencioso */ }
}

// UTILS
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// START
init();
</script>

</body>
</html>
